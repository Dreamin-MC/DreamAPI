name: Discord Release Announcement

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version or module tag to announce (e.g. 0.6.0, core-v0.6.0, item-v1.0.0)'
        required: true
        type: string
      module:
        description: 'Optional module name (e.g. core, item, gui). Leave empty for global or if included in version tag.'
        required: false
        default: ''
        type: string
      color:
        description: 'Hex color (e.g. #9e6bff)'
        required: false
        default: '#9e6bff'
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Send Discord Release Announcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK || secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_RELEASE_WEBHOOK }}
          VERSION_INPUT: ${{ inputs.version }}
          MODULE_INPUT: ${{ inputs.module }}
          COLOR_INPUT: ${{ inputs.color }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::error::No Discord webhook secret found (DISCORD_WEBHOOK / DISCORD_WEBHOOK_URL). Cannot send announcement."
            exit 1
          fi

          python3 - << 'EOF'
          import os
          import re
          import json
          import urllib.request
          import urllib.error

          webhook_url = (os.environ.get("DISCORD_WEBHOOK") or "").strip()
          raw_version = (os.environ.get("VERSION_INPUT") or "").strip()
          module_input = (os.environ.get("MODULE_INPUT") or "").strip()
          custom_color = (os.environ.get("COLOR_INPUT") or "#9e6bff").strip()

          known_modules = {
              "all", "animation", "command", "core", "cuboid", "database",
              "dialog", "glowing", "gui", "hologram", "hooks", "http",
              "item", "lang", "navigate", "nms", "particle", "recipe",
              "skin", "world", "worldborder"
          }

          mod_match = re.match(r'^([a-zA-Z0-9_-]+)-v?([0-9]+\.[0-9]+.*)$', raw_version)
          if mod_match and mod_match.group(1) in known_modules:
              module_name = mod_match.group(1)
              clean_version = mod_match.group(2)
              tag = raw_version
          elif module_input and module_input in known_modules:
              module_name = module_input
              clean_version = raw_version.lstrip("v")
              tag = f"{module_name}-v{clean_version}"
          else:
              module_name = ""
              clean_version = raw_version.lstrip("v")
              tag = f"v{clean_version}" if raw_version.startswith("v") else clean_version

          repo = os.environ.get("REPO", "Dreamin-MC/DreamAPI")
          server_url = os.environ.get("SERVER_URL", "https://github.com")

          mc_ver = "26.1.2+"
          java_ver = "25"

          release_url = f"{server_url}/{repo}/releases/tag/{tag}"

          if module_name:
              changelog_file = f"changelog/{module_name}/{clean_version}.md"
              release_title = f"DreamAPI [{module_name}] `v{clean_version}`"
              embed_title = f"🎙️ DreamAPI [{module_name}] v{clean_version}"
          else:
              changelog_file = f"changelog/{clean_version}.md"
              if not os.path.isfile(changelog_file):
                  changelog_file = f"changelog/all/{clean_version}.md"
              release_title = f"DreamAPI `v{clean_version}`"
              embed_title = f"🎙️ DreamAPI v{clean_version}"

          changelog_text = ""
          if os.path.isfile(changelog_file):
              with open(changelog_file, "r", encoding="utf-8") as f:
                  changelog_text = f.read().strip()
              changelog_text = re.sub(r'^#\s+Changelog[^\n]*\n+', '', changelog_text, flags=re.IGNORECASE)

          max_changelog_len = 1750
          if len(changelog_text) > max_changelog_len:
              changelog_text = changelog_text[:max_changelog_len] + f"\n\n*... [Read full changelog on GitHub]({release_url})*"

          sep = "&" if "?" in webhook_url else "?"
          target_url = webhook_url if "with_components=" in webhook_url else f"{webhook_url}{sep}with_components=true"

          def parse_color(val):
              if isinstance(val, int):
                  return val
              if isinstance(val, str):
                  clean = val.lstrip('#').lower()
                  if clean.startswith('0x'):
                      clean = clean[2:]
                  try:
                      return int(clean, 16)
                  except ValueError:
                      return 0x9e6bff
              return 0x9e6bff

          brand_color = parse_color(custom_color)

          v2_payload = {
              "flags": 32768,
              "components": [
                  {
                      "type": 17,
                      "accent_color": brand_color,
                      "components": [
                          {
                              "type": 10,
                              "content": (
                                  f"# 🚀 {release_title}\n"
                                  f"> *Modular Paper Plugin API & Services Foundation for Minecraft*\n\n"
                                  f"🎮 **Minecraft / Paper :** `{mc_ver}`   •   ☕ **Java :** `{java_ver}`"
                              )
                          },
                          {
                              "type": 14,
                              "spacing": 1,
                              "divider": True
                          },
                          {
                              "type": 10,
                              "content": changelog_text or "No changelog provided."
                          }
                      ]
                  }
              ]
          }

          classic_payload = {
              "content": f"🚀 **{release_title} has just been released!**",
              "embeds": [
                  {
                      "title": embed_title,
                      "url": release_url,
                      "color": brand_color,
                      "description": changelog_text or "No changelog provided.",
                      "fields": [
                          {"name": "🎮 Paper / Minecraft", "value": f"`{mc_ver}`", "inline": True},
                          {"name": "☕ Java", "value": f"`{java_ver}`", "inline": True},
                      ],
                      "footer": {
                          "text": "Dreamin' Studios • DreamAPI"
                      }
                  }
              ]
          }

          def send_payload(url, data_dict):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data_dict).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "DreamAPI-Release-Bot"
                  },
                  method="POST"
              )
              with urllib.request.urlopen(req) as resp:
                  return resp.status

          try:
              status = send_payload(target_url, v2_payload)
              print(f"Discord announcement sent successfully with Components V2! HTTP {status}")
          except urllib.error.HTTPError as e:
              status = send_payload(target_url, classic_payload)
              print(f"Classic embed notification sent successfully! HTTP {status}")
          EOF
